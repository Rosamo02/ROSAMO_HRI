<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Robot Map</title>

    <link rel="stylesheet" href="file:///home/rodrigomoreira/Rosamo_3/map_assets/leaflet.css" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body onload="console.log('HTML loaded');">
    <div id="map"></div>

    <script src="file:///home/rodrigomoreira/Rosamo_3/map_assets/leaflet.js"></script>

    <script>
        console.log("Leaflet loaded? L =", typeof L);

        L.Icon.Default.mergeOptions({
            iconUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/marker-icon.png",
            shadowUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/marker-shadow.png"
        });

        var defaultLat = 48.137154;
        var defaultLon = 11.576124;

        var map = L.map("map").setView([defaultLat, defaultLon], 16);

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Tiles © Esri"
            }
        ).addTo(map);

        var robotIcon = L.icon({
            iconUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/robot.png",
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18]
        });

        var treeIcon = L.icon({
            iconUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/tree.png",
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        var robotMarker = L.marker([defaultLat, defaultLon], {
            icon: robotIcon,
            title: "Robot"
        }).addTo(map);

        robotMarker.bindPopup(
            "Robot<br>" +
            "Waiting for GPS..."
        );

        var operatorMarker = L.marker([41.1585, -8.6285], {
            title: "Operator"
        }).addTo(map);

        operatorMarker.bindPopup("Operator");

        var laptopMarker = null;
        var treeMarkers = [];

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    var lat = pos.coords.latitude;
                    var lon = pos.coords.longitude;

                    console.log("Laptop location:", lat, lon);

                    laptopMarker = L.marker([lat, lon], {
                        title: "You"
                    }).addTo(map);

                    laptopMarker.bindPopup(
                        "You<br>" +
                        "Lat: " + lat.toFixed(6) + "<br>" +
                        "Lon: " + lon.toFixed(6)
                    );

                    // Do not center on the laptop location.
                    // The map will center on the robot from Python after GPS is received.
                    // map.setView([lat, lon], 16);
                },
                function(err) {
                    console.log("Geolocation error:", err);
                }
            );
        } else {
            console.log("Geolocation not supported");
        }

        function updateRobot(lat, lon) {
            console.log("updateRobot called with:", lat, lon);

            lat = Number(lat);
            lon = Number(lon);

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                console.log("Invalid robot GPS received:", lat, lon);
                return;
            }

            if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                console.log("Robot GPS outside valid range:", lat, lon);
                return;
            }

            robotMarker.setLatLng([lat, lon]);

            robotMarker.bindPopup(
                "Robot<br>" +
                "Lat: " + lat.toFixed(6) + "<br>" +
                "Lon: " + lon.toFixed(6)
            );

            console.log("Robot GPS updated:", lat, lon);
        }

        function updateOperator(lat, lon) {
            lat = Number(lat);
            lon = Number(lon);

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                console.log("Invalid operator GPS received:", lat, lon);
                return;
            }

            operatorMarker.setLatLng([lat, lon]);

            operatorMarker.bindPopup(
                "Operator<br>" +
                "Lat: " + lat.toFixed(6) + "<br>" +
                "Lon: " + lon.toFixed(6)
            );

            console.log("Operator GPS updated:", lat, lon);
        }

        function centerOnRobot() {
            map.setView(robotMarker.getLatLng(), 18);
        }

        function addTreeMarker(lat, lon) {
            lat = Number(lat);
            lon = Number(lon);

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                console.log("Invalid tree GPS received:", lat, lon);
                return;
            }

            if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                console.log("Tree GPS outside valid range:", lat, lon);
                return;
            }

            var marker = L.marker([lat, lon], {
                icon: treeIcon,
                title: "Tree"
            }).addTo(map);

            marker.bindPopup(
                "Tree<br>" +
                "Lat: " + lat.toFixed(6) + "<br>" +
                "Lon: " + lon.toFixed(6)
            );

            treeMarkers.push(marker);

            console.log("Tree marker added:", lat, lon);
        }

        function clearTreeMarkers() {
            for (var i = 0; i < treeMarkers.length; i++) {
                map.removeLayer(treeMarkers[i]);
            }

            treeMarkers = [];

            console.log("All tree markers cleared");
        }

        window.map = map;
        window.robotMarker = robotMarker;
        window.updateRobot = updateRobot;
        window.updateOperator = updateOperator;
        window.centerOnRobot = centerOnRobot;
        window.addTreeMarker = addTreeMarker;
        window.clearTreeMarkers = clearTreeMarkers;

        console.log("Map initialized");
    </script>
</body>
</html>
