<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Robot Map</title>

    <link rel="stylesheet" href="file:///home/rodrigomoreira/Rosamo_3/map_assets/leaflet.css" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .path-arrow-icon {
            background: transparent;
            border: none;
        }
    </style>
</head>

<body onload="console.log('HTML loaded');">
    <div id="map"></div>

    <script src="file:///home/rodrigomoreira/Rosamo_3/map_assets/leaflet.js"></script>

    <script>
        console.log("Leaflet loaded? L =", typeof L);

        L.Icon.Default.mergeOptions({
            iconUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/marker-icon.png",
            shadowUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/marker-shadow.png"
        });

        // Default to Munich city center :D
        var defaultLat = 48.137154;
        var defaultLon = 11.576124;

        var map = L.map("map").setView([defaultLat, defaultLon], 16);

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Tiles © Esri"
            }
        ).addTo(map);

        var robotIcon = L.icon({
            iconUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/robot.png",
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18]
        });

        var treeIcon = L.icon({
            iconUrl: "file:///home/rodrigomoreira/Rosamo_3/map_assets/tree.png",
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        var robotMarker = L.marker([defaultLat, defaultLon], {
            icon: robotIcon,
            title: "Robot"
        }).addTo(map);

        robotMarker.bindPopup(
            "Robot<br>" +
            "Waiting for GPS..."
        );

        var operatorMarker = L.marker([41.1585, -8.6285], {
            title: "Operator"
        }).addTo(map);

        operatorMarker.bindPopup("Operator");

        var laptopMarker = null;
        var treeMarkers = [];

        var treePathLine = null;
        var treePathArrows = [];

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    var lat = pos.coords.latitude;
                    var lon = pos.coords.longitude;

                    console.log("Laptop location:", lat, lon);

                    laptopMarker = L.marker([lat, lon], {
                        title: "You"
                    }).addTo(map);

                    laptopMarker.bindPopup(
                        "You<br>" +
                        "Lat: " + lat.toFixed(6) + "<br>" +
                        "Lon: " + lon.toFixed(6)
                    );

                    // Do not center on the laptop location.
                    // The map will center on the robot from Python after GPS is received.
                    // map.setView([lat, lon], 16);
                },
                function(err) {
                    console.log("Geolocation error:", err);
                }
            );
        } else {
            console.log("Geolocation not supported");
        }

        function updateRobot(lat, lon) {
            console.log("updateRobot called with:", lat, lon);

            lat = Number(lat);
            lon = Number(lon);

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                console.log("Invalid robot GPS received:", lat, lon);
                return;
            }

            if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                console.log("Robot GPS outside valid range:", lat, lon);
                return;
            }

            robotMarker.setLatLng([lat, lon]);

            robotMarker.bindPopup(
                "Robot<br>" +
                "Lat: " + lat.toFixed(6) + "<br>" +
                "Lon: " + lon.toFixed(6)
            );

            console.log("Robot GPS updated:", lat, lon);
        }

        function updateOperator(lat, lon) {
            lat = Number(lat);
            lon = Number(lon);

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                console.log("Invalid operator GPS received:", lat, lon);
                return;
            }

            operatorMarker.setLatLng([lat, lon]);

            operatorMarker.bindPopup(
                "Operator<br>" +
                "Lat: " + lat.toFixed(6) + "<br>" +
                "Lon: " + lon.toFixed(6)
            );

            console.log("Operator GPS updated:", lat, lon);
        }

        function centerOnRobot() {
            map.setView(robotMarker.getLatLng(), 18);
        }

        function addTreeMarker(lat, lon) {
            lat = Number(lat);
            lon = Number(lon);

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                console.log("Invalid tree GPS received:", lat, lon);
                return;
            }

            if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                console.log("Tree GPS outside valid range:", lat, lon);
                return;
            }

            var marker = L.marker([lat, lon], {
                icon: treeIcon,
                title: "Tree"
            }).addTo(map);

            marker.bindPopup(
                "Tree<br>" +
                "Lat: " + lat.toFixed(6) + "<br>" +
                "Lon: " + lon.toFixed(6)
            );

            treeMarkers.push(marker);

            console.log("Tree marker added:", lat, lon);
        }

        function clearTreeMarkers() {
            for (var i = 0; i < treeMarkers.length; i++) {
                map.removeLayer(treeMarkers[i]);
            }

            treeMarkers = [];

            clearTreePath();

            console.log("All tree markers cleared");
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            lat1 = lat1 * Math.PI / 180;
            lat2 = lat2 * Math.PI / 180;

            var dLon = (lon2 - lon1) * Math.PI / 180;

            var y = Math.sin(dLon) * Math.cos(lat2);
            var x =
                Math.cos(lat1) * Math.sin(lat2) -
                Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);

            var bearing = Math.atan2(y, x) * 180 / Math.PI;

            return (bearing + 360) % 360;
        }

        function drawTreePath(points) {
            console.log("drawTreePath called with:", points);

            if (!Array.isArray(points) || points.length < 2) {
                console.log("Not enough points to draw path");
                return;
            }

            clearTreePath();

            var validPoints = [];

            for (var i = 0; i < points.length; i++) {
                var lat = Number(points[i][0]);
                var lon = Number(points[i][1]);

                if (
                    Number.isFinite(lat) &&
                    Number.isFinite(lon) &&
                    lat >= -90 &&
                    lat <= 90 &&
                    lon >= -180 &&
                    lon <= 180
                ) {
                    validPoints.push([lat, lon]);
                } else {
                    console.log("Invalid path point skipped:", points[i]);
                }
            }

            if (validPoints.length < 2) {
                console.log("Not enough valid points to draw path");
                return;
            }

            treePathLine = L.polyline(validPoints, {
                color: "lime",
                weight: 4,
                opacity: 0.9
            }).addTo(map);

            for (var j = 0; j < validPoints.length - 1; j++) {
                var start = validPoints[j];
                var end = validPoints[j + 1];

                var midLat = (start[0] + end[0]) / 2;
                var midLon = (start[1] + end[1]) / 2;

                var bearing = getBearing(
                    start[0],
                    start[1],
                    end[0],
                    end[1]
                ) - 90; // Rotate 90 degrees to point along the path

                var arrowIcon = L.divIcon({
                    className: "path-arrow-icon",
                    html:
                        '<div style="' +
                        'transform: rotate(' + bearing + 'deg);' +
                        'font-size: 26px;' +
                        'color: lime;' +
                        'font-weight: bold;' +
                        'text-shadow: 0 0 4px black;' +
                        '">➤</div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                var arrowMarker = L.marker([midLat, midLon], {
                    icon: arrowIcon,
                    interactive: false
                }).addTo(map);

                treePathArrows.push(arrowMarker);
            }

            map.fitBounds(treePathLine.getBounds(), {
                padding: [40, 40]
            });

            console.log("Tree path with arrows drawn:", validPoints);
        }

        function clearTreePath() {
            if (treePathLine !== null) {
                map.removeLayer(treePathLine);
                treePathLine = null;
            }

            for (var i = 0; i < treePathArrows.length; i++) {
                map.removeLayer(treePathArrows[i]);
            }

            treePathArrows = [];

            console.log("Tree path cleared");
        }

        window.map = map;
        window.robotMarker = robotMarker;
        window.updateRobot = updateRobot;
        window.updateOperator = updateOperator;
        window.centerOnRobot = centerOnRobot;
        window.addTreeMarker = addTreeMarker;
        window.clearTreeMarkers = clearTreeMarkers;
        window.drawTreePath = drawTreePath;
        window.clearTreePath = clearTreePath;

        console.log("Map initialized");
    </script>
</body>
</html>
